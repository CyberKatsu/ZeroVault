version: "3.9"

services:
  # ── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zerovault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zerovault
      POSTGRES_PASSWORD: zerovault_dev_password
      POSTGRES_DB: zerovault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerovault"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zerovault_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://zerovault:zerovault_dev_password@db:5432/zerovault
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_generate_with_secrets_token_hex_32}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn zerovault.app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --log-level info

  # ── Reflex frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zerovault_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
      - "8001:8001"
    depends_on:
      - backend
    command: reflex run --env dev

volumes:
  postgres_data:
